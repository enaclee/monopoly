function start(){G=ng(ST.p.slice(0,ST.c));ON=0;scr='game';render()}
function lobH(){return `<div class=ctr><h2>Комната</h2><div style="font-size:48px;font-weight:800;letter-spacing:8px">${esc(ON)}</div><p>Отправьте код друзьям: они вводят его в разделе «По сети».</p>${G.p.map(p=>`<div class=pc style="width:100%">${esc(p.t)} ${esc(p.n)}${p.u==G.host?' 👑':''}</div>`).join('')}<p>Игроков: ${G.p.length} из 4</p>${G.host==UID?`<button class=pr style="width:100%" ${G.p.length<2?'disabled':''} onclick=begin()>▶ Начать игру</button>`:'<p>⏳ Ждём, пока хозяин начнёт игру…</p>'}<button onclick=home()>Выйти</button></div>`}
function dieTrack(i){
 const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];
 const anim=G&&G.anim&&Date.now()-G.anim.at<1500?G.anim:null;
 if(!anim&&!busy)return `<span class="die"><span class="reel-face">${faces[(G.d[i]||1)-1]}</span></span>`;
 const result=(anim?anim.final:rollFinal)[i];
 const strip=Array.from({length:20},(_,j)=>faces[((j*7+i*3+(anim?anim.id:1))%6)]).concat(faces[result-1]);
 return `<span class="die rolling"><span class="reel" style="--shift:-1160px">${strip.map(x=>`<span class="reel-face">${x}</span>`).join('')}</span></span>`;
}
function gameH(){let p=P(),s=S[p.pos],F='⚀⚁⚂⚃⚄⚅',me=act(),bt='';
if(G.ph=='over')bt=`<b>🏆 ${esc(G.w)} побеждает!</b><button class=pr onclick=home()>В меню</button>`;
else if(!me)bt=`<i>Ходит ${esc(p.n)}…</i>`;
else if(G.ph=='roll')bt=(p.j&&p.m>=50?`<button onclick=jp()>Выйти за 50$</button>`:'')+`<button class=pr onclick=roll()>🎲 Бросить</button>`;
else if(G.ph=='buy')bt=`<button class=pr ${p.m<s.pr?'disabled':''} onclick=buy()>Купить за ${s.pr}$</button><button onclick="startAuction(G.p[G.t].pos)">На аукцион</button><button onclick=fin()>Отказаться</button>`;
else bt=`<button class=pr onclick=end()>${G.dbl&&!p.j&&!p.bk?'🎲 Ещё бросок':'Завершить ход'}</button>`;
return `<div id=g><div class=sd>${seats(0)}</div><div class=b>${S.map((_,i)=>tile(i)).join('')}<div class=cn><i class="dk d1">ОБЩЕСТВЕННАЯ<br>КАЗНА</i><i class="dk d2">?</i><div><b>БАНК</b> · ${p.m}$${p.j?' 🔒':''}</div><div class=dc>${dieTrack(0)}${dieTrack(1)}</div>${G.card?`<div class=cd style="background:${G.card[0]=='c'?'#bfe3f7':'#fbbf6a'}">${G.card[0]=='c'?'🧰 Общественная казна':'❓ Шанс'}: ${esc(G.card[1])}</div>`:''}<div class=lg>${esc(G.log)}</div><div class=main-actions>${bt}</div><div class=side-actions><button onclick="auctionMenu()">🔨 Аукцион</button><button onclick="financeMenu()">🏦 Имущество</button><button onclick="surrenderAsk()">🏳 Сдаться</button></div></div></div><div class=sd>${seats(1)}</div></div>`}

function auctionMenu(){
 if(!G||scr!=='game')return;
 const props=Object.keys(G.o).filter(k=>G.o[k][0]===G.t);
 ask('Аукцион: выберите недвижимость для продажи игрокам.',[
 ['Клетка '+(G.p[G.t].pos+1)+' — выставить',()=>startAuction(G.p[G.t].pos)],
 ...props.slice(0,4).map(k=>[S[k].f+' — выставить',()=>startAuction(+k)]),
 ['Отмена',()=>0]
 ]);
}
function startAuction(i){
 const s=S[i],o=G.o[i];
 if(!s||!['p','r','u'].includes(s.y)|| (o&&o[1]>0)){
   ask('На аукцион можно выставить свободную улицу или объект без домов.',[['OK',()=>0]]);return;
 }
 G.auction={i,high:0,who:-1,turn:0,passed:[],active:G.p.map((p,j)=>j).filter(j=>!G.p[j].bk),seller:o?o[0]:-1};
 auctionNext();
}
function auctionNext(){
 const a=G.auction;if(!a)return;
 a.active=a.active.filter(i=>!G.p[i].bk&&!a.passed.includes(i));
 if(a.active.length<=1 && a.high>0){finishAuction();return}
 if(a.active.length===0){G.auction=null;G.ph='end';save();return}
 const bidder=a.active[a.turn%a.active.length];
 if(a.active.every(i=>a.passed.includes(i))){finishAuction();return}
 ask('Аукцион: '+S[a.i].f+' · ставка '+a.high+'$ · ход: '+G.p[bidder].n,
 [
  ...[10,25,50].filter(n=>G.p[bidder].m>=a.high+n).map(n=>['Ставка '+(a.high+n)+'$',()=>{a.high+=n;a.who=bidder;a.passed=[];a.turn=(a.active.indexOf(bidder)+1)%a.active.length;auctionNext()}]),
  ['Пас',()=>{if(!a.passed.includes(bidder))a.passed.push(bidder);a.turn=(a.turn+1)%a.active.length;auctionNext()}]
 ]);
}
function finishAuction(){
 const a=G.auction;if(!a)return;
 if(a.who>=0&&a.high>0){
   const buyer=G.p[a.who];buyer.m-=a.high;
   if(a.seller>=0)G.p[a.seller].m+=a.high;
   G.o[a.i]=[a.who,0];L(buyer.n+' выиграл аукцион: '+S[a.i].f+' за '+a.high+'$.');
 }else L('Аукцион завершён без ставок.');
 G.auction=null;G.ph='end';save();
}
function financeMenu(){
 if(!G||scr!=='game')return;
 const p=P(), owned=Object.keys(G.o).filter(k=>G.o[k][0]===G.t);
 const b=[['Заложить объект',()=>mortgageMenu()],['Выкупить заложенный объект',()=>redeemMenu()],['Продать дом/отель банку',()=>sellHouseMenu()],['Закрыть',()=>0]];
 ask('Имущество · '+p.m+'$ наличными. Залог даёт половину цены объекта; выкуп стоит 110% цены.',b);
}
function mortgageMenu(){
 const own=Object.keys(G.o).filter(k=>G.o[k][0]===G.t&&G.o[k][2]!==true&&G.o[k][1]===0);
 if(!own.length){ask('Нет объектов без домов, которые можно заложить.',[['OK',()=>0]]);return}
 ask('Что заложить?',[...own.slice(0,8).map(k=>[S[k].f+' · получить '+Math.floor(S[k].pr/2)+'$',()=>{const val=Math.floor(S[k].pr/2);G.p[G.t].m+=val;G.o[k][2]=true;L('Залог: '+S[k].f+' +'+val+'$.');save()}]),['Отмена',()=>0]]);
}
function redeemMenu(){
 const own=Object.keys(G.o).filter(k=>G.o[k][0]===G.t&&G.o[k][2]===true);
 if(!own.length){ask('У вас нет заложенных объектов.',[['OK',()=>0]]);return}
 ask('Выкуп залога стоит 110% половины цены объекта.',[...own.map(k=>{let v=Math.ceil(S[k].pr*.55);return[S[k].f+' · '+v+'$',()=>{if(P().m<v){ask('Недостаточно денег.',[['OK',()=>0]]);return}P().m-=v;delete G.o[k][2];L('Выкуплен залог: '+S[k].f+'.');save()}]}),['Отмена',()=>0]]);
}
function sellHouseMenu(){
 const own=Object.keys(G.o).filter(k=>G.o[k][0]===G.t&&G.o[k][1]>0);
 if(!own.length){ask('У вас нет домов или отелей для продажи.',[['OK',()=>0]]);return}
 ask('Продать улучшение банку за половину стоимости.',own.map(k=>[S[k].f+' · продать улучшение',()=>{const v=Math.floor(HC[S[k].g]/2);G.o[k][1]--;P().m+=v;L('Продано улучшение за '+v+'$.');save()}]).concat([['Отмена',()=>0]]));
}
function surrenderAsk(){
 if(!G||scr!=='game')return;
 ask(P().n+', действительно сдаться и выбыть из игры?', [['Да, сдаться',()=>surrender(G.t)],['Остаться',()=>0]]);
}
function surrender(i){
 const p=G.p[i];if(!p||p.bk)return;
 p.bk=true;p.m=0;
 Object.keys(G.o).forEach(k=>{if(G.o[k][0]===i)delete G.o[k]});
 L(p.n+' добровольно сдался и выбыл.');
 const alive=G.p.filter(x=>!x.bk);
 if(alive.length<=1){G.w=alive[0]?.n||'—';G.ph='over'}else if(G.t===i)nx();
 save();
}
function render(){document.documentElement.className=scr=='game'?'wd':'gr';$('#app').innerHTML=({menu:menuH,setup:setH,lobby:lobH,game:gameH}[scr])()+(M?`<div class=md><div class=mb><p>${esc(M.t)}</p>${M.b.map((b,k)=>`<button onclick=mb(${k})>${b[0]}</button>`).join('')}</div></div>`:'')}
function save(){if(ON&&DB&&G)DB.ref('rooms/'+ON).set({s:G}).catch(()=>toast('Ошибка сети: проверьте правила Firebase.'));render()}
function roll(){
 if(G.ph!='roll'||busy)return;
 busy=1;const final=[R(6)+1,R(6)+1];rollFinal=final;
 G.anim={id:(G.anim?.id||0)+1,at:Date.now(),final};
 save();
 setTimeout(()=>{if(!G)return;G.d=final;delete G.anim;busy=0;go(final[0],final[1])},1500);
}
function go(a,b){let p=P(),d=a==b;G.d=[a,b];G.card=0;G.log='';G.dbl=d?(G.dbl||0)+1:0;
if(p.j){if(d){p.j=0;G.dbl=0;L('Дубль — свобода!')}else if(--p.j){L(p.n+' остаётся в тюрьме.');return nx()}else{p.m-=50;L('Платит 50 и выходит.');if(p.m<0)bust(p)}}
else if(G.dbl>2)return jail(p,'Три дубля подряд!');
p.bk?fin():mv(a+b)}
function mv(n){let p=P(),o=p.pos;p.pos=(o+n)%40;if(p.pos<o){p.m+=200;L('+200 за Старт.')}L(p.n+' → '+S[p.pos].f+'.');land(p)}
function mono(w,g){return S.every((x,j)=>x.y!='p'||x.g!=g||(G.o[j]&&G.o[j][0]==w))}
function rent(i){let s=S[i],o=G.o[i],w=o[0];if(s.y=='p')return o[1]?s.r[o[1]]:s.r[0]*(mono(w,s.g)?2:1);
let c=S.filter((x,j)=>x.y==s.y&&G.o[j]&&G.o[j][0]==w).length;return s.y=='r'?25<<(c-1):(G.d[0]+G.d[1])*(c>1?10:4)}
function pay(p,a,to){p.m-=a;if(to!=null)G.p[to].m+=a;if(p.m<0)bust(p)}
function bust(p){let i=G.p.indexOf(p);if(p.m>=0)return;
 const assets=Object.keys(G.o).filter(k=>G.o[k][0]===i);
 if(assets.length){p.m=0;ask(p.n+' не хватает денег. Можно заложить имущество или сдаться.',[['Заложить имущество',()=>{G.t=i;mortgageMenu()}],['Сдаться',()=>surrender(i)]]);return}
 p.bk=1;p.m=0;L(p.n+' выбыл: банкротство.');let a=G.p.filter(x=>!x.bk);if(a.length<2){G.w=a[0]?a[0].n:'—';G.ph='over'} }
function land(p){let s=S[p.pos],o=G.o[p.pos];
if('pru'.includes(s.y)){if(!o){G.ph='buy';return save()}if(o[0]!=G.t&&!o[2]){let r=rent(p.pos);L('Рента '+r+'$ → '+G.p[o[0]].n+'.');pay(p,r,o[0])}}
else if(s.y=='t'){L('Налог '+s.pr+'$.');pay(p,s.pr)}
else if(s.y=='k')return jail(p,'')
else if(s.y=='c'||s.y=='x')return card(p,s.y);
fin()}
function card(p,y){let c=C[y][R(C[y].length)].split('|'),v=+c[2];G.card=[y,c[0]];
if(c[1]=='m')pay(p,-v);else if(c[1]=='g'){if(v<p.pos){p.m+=200}p.pos=v;return land(p)}
else if(c[1]=='b'){p.pos=(p.pos+37)%40;return land(p)}else if(c[1]=='j')return jail(p,'');
else if(c[1]=='e')G.p.forEach((q,i)=>{if(i!=G.t&&!q.bk)pay(q,v,G.t)});
fin()}
function jail(p,t){p.pos=10;p.j=3;G.dbl=0;L(t+' '+p.n+' отправляется в тюрьму!');nx()}
function jp(){let p=P();p.m-=50;p.j=0;G.log=p.n+' заплатил 50 и свободен. ';save()}
function buy(){let p=P(),s=S[p.pos];if(p.m<s.pr)return;p.m-=s.pr;G.o[p.pos]=[G.t,0];L(p.n+' купил '+s.f+'.');fin()}
function fin(){G.ph=G.w?'over':'end';save()}
function end(){let p=P();if(G.dbl&&!p.j&&!p.bk&&!G.w){G.ph='roll';save()}else nx()}
function nx(){do G.t=(G.t+1)%G.p.length;while(G.p[G.t].bk);G.ph=G.w?'over':'roll';G.dbl=0;save()}
['roll','buy','fin','end','jp'].forEach(k=>{let f=window[k];window[k]=(...a)=>act()&&f(...a)});
function tap(i){let s=S[i],o=G.o[i],t=s.f+(s.pr?' · '+s.pr+'$':'');
if(s.y=='p')t+=' · рента: '+s.r.join(' / ');if(o)t+=' · владелец: '+G.p[o[0]].n+(o[1]?' · домов: '+o[1]:'')+(o[2]?' · ЗАЛОЖЕНО':'');
let b=[['OK',()=>0]];
if(o&&o[0]==G.t&&s.y=='p'&&act()&&(G.ph=='roll'||G.ph=='end')&&o[1]<5&&!o[2]&&mono(G.t,s.g)){let c=HC[s.g];b.unshift(['🏠 Построить за '+c+'$',()=>{if(P().m<c)return;P().m-=c;o[1]++;G.log=P().n+' строит на '+s.n+'. ';save()}])}
ask(t,b)}

function listen(c){
 if(unsub)unsub();ON=c;const ref=DB.ref('rooms/'+c);
 const cb=ref.on('value',snap=>{
  const d=snap.val();if(!d||!d.s)return;
  G=typeof d.s==='string'?JSON.parse(d.s):d.s;
  scr=G.st==='lobby'?'lobby':'game';
  if(G.anim&&Date.now()-G.anim.at<1500){rollFinal=G.anim.final;busy=1;setTimeout(()=>{busy=0;render()},Math.max(0,1500-(Date.now()-G.anim.at)))}else busy=0;
  render();
 },err=>{console.error(err);toast('Потеряна связь с Firebase')});
 unsub=()=>ref.off('value',cb);
}
