<script>

const AD='Ленивый,Хитрый,Пузатый,Бешеный,Сонный,Дерзкий,Жадный,Пушистый,Грозный,Весёлый,Хмурый,Лихой'.split(','),

function seats(k){return G.p.map((q,i)=>i%2==k?`<div class="seat${i==G.t?' on':''}${q.bk?' bk':''}" style="--pc:${PC[i]}"><span class=av>${esc(q.t)}</span><div class=nm><b>${esc(q.n)}${q.u&&q.u==UID?' (вы)':''}</b><em>${q.m}$</em><small>${Object.values(G.o).filter(o=>o[0]==i).length} 🏘</small></div></div>`:'').join('')}

Отступите на 3 клетки назад|b|0
Штраф за скорость: −15|m|-15

Отправляйтесь в тюрьму!|j|0`.split('\n')};
